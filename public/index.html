<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Corner Chatbot</title>
<style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#f0ebff,#e8f4fd);min-height:100vh;display:flex;align-items:center;justify-content:center;}.card{background:white;border-radius:20px;padding:48px 40px;text-align:center;box-shadow:0 8px 40px rgba(107,70,193,.12);max-width:480px;width:90%;}.logo{font-size:56px;margin-bottom:16px;}h1{color:#6B46C1;font-size:28px;margin-bottom:8px;}p{color:#666;font-size:16px;margin-bottom:24px;line-height:1.6;}.badge{display:inline-flex;align-items:center;gap:8px;background:#f0ebff;color:#6B46C1;padding:8px 20px;border-radius:24px;font-size:13px;font-weight:600;}.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite;}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}.embed-box{margin-top:32px;background:#f9f7ff;border-radius:12px;padding:20px;text-align:left;}.embed-box h3{color:#6B46C1;font-size:13px;margin-bottom:8px;font-weight:600;}.embed-box code{font-size:11px;color:#444;word-break:break-all;display:block;background:white;padding:10px;border-radius:8px;border:1px solid #e2d9f3;line-height:1.6;}</style>
</head>
<body>
<div class="card">
<div class="logo">🐾</div>
<h1>Pet Corner AI Chatbot</h1>
<p>Your Claude-powered chatbot is live! Click the purple bubble in the bottom-right to chat.</p>
<div class="badge"><div class="dot"></div>&nbsp;Claude AI · Online</div>
<div class="embed-box">
<h3>Add to any website — paste before &lt;/body&gt;:</h3>
<code>&lt;script src="https://petcorner-chatbot.vercel.app/widget.js"&gt;&lt;/script&gt;</code>
</div>
</div>
<script src="/widget.js"></script>
</body>
</html>
